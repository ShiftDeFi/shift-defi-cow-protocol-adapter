# CI runs the same `make verify` as a local run.
#
# The pins below must match the local toolchain; check with `make tools` and
# bump both sides together. The runner image and Python version are pinned in
# the job.
#
# No ETH_RPC_URL secret: fork tests run locally via `make fork`, which keeps
# this pipeline hermetic.

name: CI

permissions:
  contents: read

# Pull requests targeting main, plus manual dispatch. Pushes to other branches
# do not run the gate; branch protection on main is what makes that safe, by
# ensuring main can only be reached through a passing pull request.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the run still in flight for it, so a
# burst of commits costs one full run rather than one per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_VERSION: v1.4.4
  SLITHER_VERSION: 0.11.6
  ADERYN_VERSION: 0.6.8

jobs:
  wall:
    name: Wall
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Cached paths: ~/.cache/pip holds slither's wheels, ~/.cyfrin the aderyn
      # binary, ~/.svm the solc version forge downloads. The key carries every
      # pin, so bumping one rebuilds the cache. The v2 prefix retires caches
      # written while aderyn was landing outside ~/.cyfrin, which restored an
      # empty directory and skipped the install.
      - name: Cache pinned toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cyfrin
            ~/.svm
          key: wall-v2-${{ runner.os }}-py3.12-slither${{ env.SLITHER_VERSION }}-aderyn${{ env.ADERYN_VERSION }}-foundry${{ env.FOUNDRY_VERSION }}

      - name: Install Slither (pinned)
        run: pip install "slither-analyzer==${SLITHER_VERSION}"

      # ADERYN_INSTALL_DIR is what puts the binary in ~/.cyfrin/bin; left unset
      # the installer picks $CARGO_HOME/bin, which the cache does not cover and
      # the PATH step below does not name. The guard is the binary itself rather
      # than the cache hit, so a cache restored without it reinstalls instead of
      # failing at the toolchain report.
      - name: Install Aderyn (pinned)
        run: |
          if [ ! -x "$HOME/.cyfrin/bin/aderyn" ]; then
            export ADERYN_INSTALL_DIR="$HOME/.cyfrin"
            curl --proto '=https' --tlsv1.2 -LsSf \
              "https://github.com/cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-installer.sh" | bash
          fi

      - name: Add Aderyn to PATH
        run: echo "$HOME/.cyfrin/bin" >> "$GITHUB_PATH"

      # Fail EARLY and clearly if a tool is missing, rather than mid-`make verify`.
      - name: Toolchain report
        run: make tools

      # Cheap, and independent of the contracts, so it runs before the gate:
      # a broken hook fails here in seconds rather than after the full suite.
      - name: make test-hooks
        run: make test-hooks

      - name: make verify
        run: make verify
